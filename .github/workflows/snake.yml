name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # Run every 12 hours
  workflow_dispatch:          # Allows manual trigger
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Generate Snake Contribution Files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots order = [0 contributions, low, med, high, highest]
          # Exactly 5 dot colors are required.
          outputs: |
            dist/snake-neon-dark.svg?color_snake=#F72585&color_dots=#161b22,#3C096C,#5A189A,#9D4EDD,#E0AAFF
            dist/snake-neon-light.svg?color_snake=#F72585&color_dots=#ebedf0,#C77DFF,#9D4EDD,#7B2CBF,#5A189A
            dist/snake-neon.gif?color_snake=#F72585&color_dots=#161b22,#3C096C,#5A189A,#9D4EDD,#E0AAFF&color_background=#0D1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake Files to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake contributions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
